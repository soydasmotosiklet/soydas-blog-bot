name: Taslak komutları (/yayinla, /yeniden, /iptal)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-bot
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'taslak') &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER') &&
      (startsWith(github.event.comment.body, '/yayinla') || startsWith(github.event.comment.body, '/yayınla') ||
       startsWith(github.event.comment.body, '/yeniden') || startsWith(github.event.comment.body, '/iptal'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      COMMENT: ${{ github.event.comment.body }}
      IKAS_CLIENT_ID: ${{ secrets.IKAS_CLIENT_ID }}
      IKAS_CLIENT_SECRET: ${{ secrets.IKAS_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          git config user.name "soydas-blog-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Taslağı bul
        id: meta
        run: |
          SLUG=$(printf '%s' "$ISSUE_BODY" | grep -o '<!-- draft:[a-z0-9-]* -->' | head -1 | sed 's/<!-- draft:\(.*\) -->/\1/')
          if [ -z "$SLUG" ]; then gh issue comment "$ISSUE" --body "⚠️ Bu issue'da taslak kimliği bulunamadı."; exit 1; fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE" --body "⏳ Komut alındı, işleniyor…"

      - name: Yayınla
        if: startsWith(env.COMMENT, '/yayinla') || startsWith(env.COMMENT, '/yayınla')
        id: pub
        run: |
          node src/cli.js publish "${{ steps.meta.outputs.slug }}"
          git add -A drafts state && git commit -m "Yayınlandı: ${{ steps.meta.outputs.slug }}" && git push
      - if: steps.pub.outcome == 'success'
        run: |
          gh issue comment "$ISSUE" --body "✅ Yayınlandı: ${{ steps.pub.outputs.url }} (site önbelleği nedeniyle birkaç dakika içinde görünür)"
          gh issue close "$ISSUE"

      - name: İptal
        if: startsWith(env.COMMENT, '/iptal')
        run: |
          node src/cli.js discard "${{ steps.meta.outputs.slug }}"
          git add -A drafts && git commit -m "İptal: ${{ steps.meta.outputs.slug }}" && git push || true
          gh issue comment "$ISSUE" --body "🗑️ Taslak iptal edildi."
          gh issue close "$ISSUE" --reason "not planned"

      - name: Yeniden yaz
        if: startsWith(env.COMMENT, '/yeniden')
        run: |
          TOPIC=$(node src/cli.js topic-of "${{ steps.meta.outputs.slug }}")
          FEEDBACK=$(printf '%s' "$COMMENT" | sed '1s#^/yeniden##')
          node src/cli.js discard "${{ steps.meta.outputs.slug }}"
          node src/cli.js draft --topic "$TOPIC" --feedback "$FEEDBACK" > out.txt
          git add -A drafts state && git commit -m "Yeniden yazıldı: $TOPIC" && git push
          NEW=$(gh issue create --title "📝 Blog taslağı: $TOPIC" --body-file out/issue.md --label taslak --assignee "${{ github.repository_owner }}")
          gh issue comment "$ISSUE" --body "🔁 Yeni taslak hazırlandı: $NEW"
          gh issue close "$ISSUE" --reason "not planned"

      - name: Hata bildir
        if: failure()
        run: |
          gh issue comment "$ISSUE" --body "❌ İşlem başarısız oldu. Ayrıntılar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
