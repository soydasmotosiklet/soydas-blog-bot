name: Yayındaki yazıların görsellerini yenile

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Tek yazı için adresi (slug). Boş bırakılırsa gorsel-listesi.json içindeki tüm yazılar.'
        required: false
        default: ''
      force:
        description: 'Daha önce hazırlanmış görselleri de yeniden üret (evet/hayır)'
        required: false
        default: 'hayir'

permissions:
  contents: write

concurrency:
  group: blog-bot
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Görselleri üret (Gemini + Claude denetimi)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SLUG: ${{ github.event.inputs.slug }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ -n "$SLUG" ]; then ARGS="$ARGS --only $SLUG"; fi
          if [ "$FORCE" = "evet" ] || [ -n "$SLUG" ]; then ARGS="$ARGS --force 1"; fi
          node src/cli.js refresh-list $ARGS
      - name: Kaydet
        if: always()
        run: |
          git config user.name "soydas-blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A fixes
          git commit -m "Görsel yenileme ${{ github.event.inputs.slug }}" || echo "değişiklik yok"
          git pull --rebase origin main && git push
