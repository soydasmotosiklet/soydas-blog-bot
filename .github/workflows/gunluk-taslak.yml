name: Günlük blog taslağı

on:
  schedule:
    - cron: '51 5 * * *'   # Her gün 08:51 (Türkiye saati, UTC+3)
  workflow_dispatch:
    inputs:
      topic:
        description: 'İsteğe bağlı: belirli bir konu başlığı (boşsa listeden sıradaki)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-bot
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Taslak oluştur
        id: draft
        env:
          IKAS_CLIENT_ID: ${{ secrets.IKAS_CLIENT_ID }}
          IKAS_CLIENT_SECRET: ${{ secrets.IKAS_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ -n "$TOPIC" ]; then node src/cli.js draft --topic "$TOPIC"; else node src/cli.js draft; fi

      - name: Taslağı kaydet
        run: |
          git config user.name "soydas-blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add drafts state
          git commit -m "Taslak: ${{ steps.draft.outputs.title }}" || echo "değişiklik yok"
          git push

      - name: Onay için issue aç
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          gh label create taslak --color FBCA04 --description "Onay bekleyen blog taslağı" 2>/dev/null || true
          gh issue create --title "📝 Blog taslağı: $TITLE" --body-file out/issue.md --label taslak --assignee "${{ github.repository_owner }}"
