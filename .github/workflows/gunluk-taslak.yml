name: Günlük blog taslağı

on:
  schedule:
    - cron: '17 4 * * 1,2,4,5'   # 07:17 TR. Haftada 2 yazı: Pazartesi ve Perşembe; Salı/Cuma sadece önceki günün yazısı çıkmadıysa (telafi)
  workflow_dispatch:
    inputs:
      topic:
        description: 'İsteğe bağlı: belirli bir konu başlığı (boşsa listeden sıradaki)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-bot
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Taslak oluştur
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ -n "$TOPIC" ]; then node src/cli.js draft --topic "$TOPIC"; else node src/cli.js draft; fi

      - name: Konu listesi bitti uyarısı
        if: steps.draft.outputs.skipped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create konu-listesi --color D93F0B --description "Yeni yazı konusu gerekiyor" 2>/dev/null || true
          if [ -z "$(gh issue list --label konu-listesi --state open --json number --jq '.[].number')" ]; then
            gh issue create --label konu-listesi --assignee "${{ github.repository_owner }}" \
              --title "📝 Konu listesi bitti: yeni model rehberi konusu ekleyin" \
              --body "topics.json içindeki tüm konular yazıldı. Blog Kılavuzu gereği bot kendi başına yeni konu uydurmaz. Arama verisi olan bir model rehberi (ör. yeni bir model) ya da tedarikçi verisi gelen bir uyum/beden rehberi başlığını topics.json dosyasına ekleyin; bir sonraki Pazartesi/Perşembe yazılır."
          fi

      - name: Taslağı kaydet
        if: steps.draft.outputs.skipped == ''
        run: |
          git config user.name "soydas-blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A drafts state
          git commit -m "Taslak: ${{ steps.draft.outputs.title }}" || echo "değişiklik yok"
          git push

      - name: Onay için issue aç
        if: steps.draft.outputs.skipped == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          gh label create taslak --color FBCA04 --description "Onay bekleyen blog taslağı" 2>/dev/null || true
          gh label create onaylandi --color 0E8A16 --description "Onaylandı, ikas'a eklenmeyi bekliyor" 2>/dev/null || true
          sleep 5   # görsellerin raw adreste hazır olması için
          gh issue create --title "📰 Bugünün yazısı: $TITLE" --body-file out/issue.md --label taslak --assignee "${{ github.repository_owner }}"
